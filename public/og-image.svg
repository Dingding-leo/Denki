<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Logo area -->
  <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#bolt)" opacity="0.9"/>
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="800">⚡</text>

  <!-- Main text -->
  <text x="170" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1">Denki</text>
  <text x="170" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#8e8e93" font-weight="500" letter-spacing="-0.5">電気 · The modern spaced repetition studio</text>

  <!-- Tagline -->
  <text x="60" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1.5">
    <tspan fill="url(#textGrad)">Open Source</tspan> Anki Alternative
  </text>
  <text x="60" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#8e8e93" font-weight="400">
    Beautiful UI · FSRS 4.5 · AI Card Generation · Local-First · Free Forever
  </text>

  <!-- Feature pills -->
  <g transform="translate(60, 460)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle" font-weight="600">🧠 FSRS 4.5</text>

    <rect x="195" y="0" width="170" height="40" rx="20" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="280" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle" font-weight="600">✨ AI Generate</text>

    <rect x="380" y="0" width="150" height="40" rx="20" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
    <text x="455" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#f9a8d4" text-anchor="middle" font-weight="600">🎨 Offline</text>

    <rect x="545" y="0" width="130" height="40" rx="20" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="610" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#86efac" text-anchor="middle" font-weight="600">🐳 Docker</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(99,102,241,0.08)"/>
  <text x="60" y="613" font-family="monospace" font-size="18" fill="#6b7280">github.com/Dingding-leo/Denki</text>
  <text x="1100" y="613" font-family="monospace" font-size="18" fill="#a5b4fc" text-anchor="end" font-weight="600">MIT License</text>
</svg>
