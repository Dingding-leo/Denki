name: Format all study integrity files

on:
  push:
    branches: [refactor/study-session-integrity]
    paths:
      - .github/workflows/format-study-integrity-all.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/study-session-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format maintenance sources and tests
        run: |
          npx --yes prettier@3.6.2 --write \
            src/components/Flashcard.tsx \
            src/components/__tests__/FlashcardSpeech.test.tsx \
            src/components/modals/SettingsModal.tsx \
            src/pages/StudySessionPage.tsx \
            src/services/speech.ts \
            src/services/__tests__/unlimitedStudy.test.ts \
            src/store/slices/__tests__/studySlice.test.ts \
            src/store/slices/statsSlice.ts \
            src/store/slices/studySlice.ts \
            src/store/useFlashcardStore.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit formatting
        run: |
          rm .github/workflows/format-study-integrity-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(study): normalize maintenance source formatting"
          git push origin HEAD:refactor/study-session-integrity
