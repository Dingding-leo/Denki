name: Apply study-session integrity maintenance

on:
  push:
    branches: [refactor/study-session-integrity]
    paths:
      - .github/workflows/apply-study-integrity.yml
      - scripts/apply-study-integrity.py
      - scripts/fix-study-integrity-script.py

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/study-session-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair maintenance patch
        run: python3 scripts/fix-study-integrity-script.py
      - name: Apply maintenance changes
        run: python3 scripts/apply-study-integrity.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified maintenance pass
        run: |
          rm .github/workflows/apply-study-integrity.yml scripts/apply-study-integrity.py scripts/fix-study-integrity-script.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(study): harden speech, drill, and review integrity"
          git push origin HEAD:refactor/study-session-integrity
