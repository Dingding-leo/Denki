name: Minimize library maintenance diff

on:
  push:
    branches: [refactor/library-loading-card-manager]
    paths:
      - .github/workflows/minimize-library-diff.yml
      - scripts/reapply-card-manager-minimal.py

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/library-loading-card-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore focused source formatting
        run: |
          git checkout b98983c5734f3da8f1897ae1fb9b82945b7c32f2 -- \
            src/db/index.ts \
            src/store/slices/classSlice.ts \
            src/store/slices/deckSlice.ts \
            src/store/slices/cardSlice.ts \
            src/db/__tests__/migrations.test.ts \
            src/store/slices/__tests__/loadRaces.test.ts
          git show origin/main:src/components/modals/ManageCardsModal.tsx > src/components/modals/ManageCardsModal.tsx
          python3 scripts/reapply-card-manager-minimal.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit focused diff
        run: |
          rm .github/workflows/minimize-library-diff.yml scripts/reapply-card-manager-minimal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(cards): keep the maintenance diff focused"
          git push origin HEAD:refactor/library-loading-card-manager
