name: Bootstrap storage health integration

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/bootstrap-storage-health.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/storage-health-diagnostics
      - name: Integrate the storage health panel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/modals/SettingsModal.tsx')
          text = path.read_text()

          import_marker = "} from 'lucide-react';\n"
          import_line = (
              "} from 'lucide-react';\n"
              "import { StorageHealthPanel } from '../settings/StorageHealthPanel';\n"
          )
          if import_marker not in text:
              raise SystemExit('Could not locate the Settings icon import.')
          text = text.replace(import_marker, import_line, 1)

          portable_marker = (
              "        <section style={sectionStyle}>\n"
              "          <h4 style={sectionHeadingStyle}>Portable backup</h4>"
          )
          panel = (
              "        <StorageHealthPanel\n"
              "          disabled={importing || exporting || optimizingMedia}\n"
              "        />\n\n"
          )
          if portable_marker not in text:
              raise SystemExit('Could not locate the portable-backup section.')
          text = text.replace(portable_marker, panel + portable_marker, 1)
          path.write_text(text)
          PY
      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-storage-health.yml
      - name: Validate focused integration
        run: |
          git diff --check
          npm ci
          npx tsc --noEmit
          npm run lint
          npx vitest run \
            src/services/__tests__/storageHealth.test.ts \
            src/components/__tests__/StorageHealthPanel.test.tsx \
            src/services/__tests__/dataSafety.test.ts
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/bootstrap-storage-health.yml
          git commit -m "feat: expose storage health diagnostics"
          git push origin HEAD:feat/storage-health-diagnostics
