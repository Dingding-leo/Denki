'''
          new_states = '''  const [retention, setRetention] = useState(() => readNumberSetting('denki-fsrs-retention', 0.9));
  const [easyBonus, setEasyBonus] = useState(() => readNumberSetting('denki-fsrs-easy-bonus', 1.3));
  const [hardMultiplier, setHardMultiplier] = useState(() => readNumberSetting('denki-fsrs-hard-multiplier', 1.2));
  const [speechSpeed, setSpeechSpeed] = useState(() => readNumberSetting('denki-speech-speed', 1.0));
  const [newCardsPerDay, setNewCardsPerDay] = useState(loadNewCardsPerDay);
'''
          if old_states not in settings:
              raise RuntimeError('Settings state block changed')
          settings = settings.replace(old_states, new_states, 1)
          effect_start = settings.index('  useEffect(() => {\n    const r = localStorage.getItem')
          effect_end = settings.index('\n\n  const handleSave', effect_start)
          settings_effect = '''  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key === 'Escape') onClose();
