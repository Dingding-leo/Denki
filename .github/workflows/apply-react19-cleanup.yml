name: Apply React 19 warning cleanup

on:
  push:
    branches: [fix/react-19-zero-warnings]
    paths:
      - .github/workflows/apply-react19-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/react-19-zero-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply React 19-safe refactors
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              write(path, content.replace(old, new, 1))

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              content = read(path)
              start = content.index(start_marker)
              end = content.index(end_marker, start)
              write(path, content[:start] + replacement + content[end:])

          # App initialization: read stable actions directly from the Zustand store.
          replace_once('src/App.tsx', '  const store = useFlashcardStore();\n', '')
          replace_once('src/App.tsx', '          store.loadClasses(),\n          store.loadDecks(),', '          useFlashcardStore.getState().loadClasses(),\n          useFlashcardStore.getState().loadDecks(),')

          # Flashcard speech callback: make dependencies explicit and prevent stale card text.
          flashcard = read('src/components/Flashcard.tsx')
          start = flashcard.index('  const speakText = (text: string) => {')
          end = flashcard.index('\n\n  const lastSpokenRef', start)
          speak_block = flashcard[start:end]
          speak_block = speak_block.replace('  const speakText = (text: string) => {', '  const speakText = React.useCallback((text: string) => {', 1)
          if not speak_block.endswith('  };'):
              raise RuntimeError('Flashcard speakText terminator changed')
          speak_block = speak_block[:-4] + '  }, [selectedVoice]);'
          flashcard = flashcard[:start] + speak_block + flashcard[end:]
          flashcard = flashcard.replace(
              '  }, [card.id, isFlipped, autoSpeak]);',
              '  }, [card.id, card.front, card.back, isFlipped, autoSpeak, speakText]);',
              1,
          )
          write('src/components/Flashcard.tsx', flashcard)

          # Learn Mode: use React 19 Effect Events instead of mutating refs during render.
          learn = read('src/components/LearnMode.tsx')
          learn = learn.replace(
              "import React, { useState, useEffect, useRef } from 'react';",
              "import React, { useState, useEffect, useRef, useEffectEvent } from 'react';",
              1,
          )
          learn = learn.replace(
              "  const session = useFlashcardStore(s => s.session);\n",
              "  const session = useFlashcardStore(s => s.session);\n  const currentCard = session?.queue[session.currentIndex];\n",
              1,
          )
          refs_start = learn.index('  // Refs + the global keydown listener')
          refs_end = learn.index('  // Normalize string for fuzzy comparison', refs_start)
          learn = learn[:refs_start] + learn[refs_end:]
          learn = learn.replace(
              '  const handleCheckAnswer = () => {\n    let correct = false;',
              '  const handleCheckAnswer = () => {\n    if (!currentCard) return;\n\n    let correct = false;',
              1,
          )
          old_sync_start = learn.index('  // Refs (declared above the early returns)')
          old_sync_end = learn.index('  // Memoize the markdown parses BEFORE any early return', old_sync_start)
          effect_event = '''  const handleGlobalKeyDown = useEffectEvent((e: KeyboardEvent) => {
    const tag = (e.target as HTMLElement)?.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;
    if (e.target === textareaRef.current && e.key !== 'Escape') return;

    if (e.key === 'Escape') {
      onExit?.();
      return;
    }

    if (!session || !currentCard) return;

    if (!checked) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleCheckAnswer();
      }
      return;
    }

    if (['1', '2', '3', '4', '5'].includes(e.key)) {
      e.preventDefault();
      void handleRating(Number.parseInt(e.key, 10) as 1 | 2 | 3 | 4 | 5);
    } else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      void handleRating(isCorrect ? 5 : 1);
    } else if ((e.key === 'o' || e.key === 'O') && overrideAllowed) {
      handleOverride();
    }
  });

  useEffect(() => {
    const listener = (event: KeyboardEvent) => handleGlobalKeyDown(event);
    window.addEventListener('keydown', listener);
    return () => window.removeEventListener('keydown', listener);
  }, []);

'''
          learn = learn[:old_sync_start] + effect_event + learn[old_sync_end:]
          learn = learn.replace(
              '  const memoCard = session?.queue[session?.currentIndex ?? 0];',
              '  const memoCard = currentCard;',
              1,
          )
          learn = learn.replace(
              '\n  const currentCard = session.queue[session.currentIndex];\n',
              '\n',
              1,
          )
          write('src/components/LearnMode.tsx', learn)

          # Match Game: state-backed cards, stable callbacks, and event-driven completion.
          match = read('src/components/MatchGame.tsx')
          component_start = match.index('export const MatchGame: React.FC<MatchGameProps>')
          condition_marker = '  if (!loading && deckCardsRef.current.length < 3) {'
          component_end = match.index(condition_marker, component_start)
          new_match_logic = '''export const MatchGame: React.FC<MatchGameProps> = (props) => (
  <MatchGameForDeck key={props.deckId} {...props} />
);

const buildMatchItems = (cards: Card[], gameSize: number): MatchItem[] => {
  const selectedCards = shuffleArray(cards).slice(0, Math.min(cards.length, gameSize));
  const matchItems: MatchItem[] = [];

  for (const card of selectedCards) {
    if (!card.id) continue;
    const isCloze = card.front.includes('{{c') && card.front.includes('::');
    matchItems.push({
      id: `${card.id}-front`,
      cardId: card.id,
      side: 'front',
      content: card.front,
      isCloze,
      state: 'idle',
    });
    matchItems.push({
      id: `${card.id}-back`,
      cardId: card.id,
      side: 'back',
      content: card.back,
      isCloze: false,
      state: 'idle',
    });
  }

  return shuffleArray(matchItems);
};

const MatchGameForDeck: React.FC<MatchGameProps> = ({ deckId, onExit, onExitToSession }) => {
  const deckName = useFlashcardStore(
    (state) => state.decks.find(d => d.id === deckId)?.name || 'Deck',
  );

  const [deckCards, setDeckCards] = useState<Card[]>([]);
  const [items, setItems] = useState<MatchItem[]>([]);
  const [selectedId, setSelectedId] = useState<string | null>(null);
  const [time, setTime] = useState(0);
  const [isActive, setIsActive] = useState(false);
  const [isCompleted, setIsCompleted] = useState(false);
  const [highScore, setHighScore] = useState<number | null>(() => {
    const stored = localStorage.getItem(`denki-match-highscore-${deckId}`);
    if (!stored) return null;
    const parsed = Number.parseFloat(stored);
    return Number.isFinite(parsed) ? parsed : null;
  });
  const [newHighScoreBadge, setNewHighScoreBadge] = useState(false);
  const [gameSize, setGameSize] = useState(6);
  const [loading, setLoading] = useState(true);

  const timerRef = useRef<ReturnType<typeof setInterval> | null>(null);
  const mismatchResetRef = useRef<ReturnType<typeof setTimeout> | null>(null);
  const startTimeRef = useRef(0);
  const penaltyRef = useRef(0);

  const stopTimer = React.useCallback(() => {
    if (timerRef.current) {
      clearInterval(timerRef.current);
      timerRef.current = null;
    }
  }, []);

  useEffect(() => {
    let cancelled = false;
    db.cards.where('deckId').equals(deckId).toArray()
      .then((cards) => {
        if (cancelled) return;
        setDeckCards(cards);
        setLoading(false);
      })
      .catch((error: unknown) => {
        if (cancelled) return;
        console.error('Failed to load cards for Match Game:', error);
        setDeckCards([]);
        setLoading(false);
      });

    return () => {
      cancelled = true;
      stopTimer();
      if (mismatchResetRef.current) {
        clearTimeout(mismatchResetRef.current);
        mismatchResetRef.current = null;
      }
    };
  }, [deckId, stopTimer]);

  useEffect(() => {
    if (!isActive) return;
    const onKey = (e: KeyboardEvent) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        onExitToSession?.();
        setIsActive(false);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isActive, onExitToSession]);

  useEffect(() => {
    if (!isActive) {
      stopTimer();
      return;
    }

    startTimeRef.current = Date.now();
    penaltyRef.current = 0;
    timerRef.current = setInterval(() => {
      const elapsed = (Date.now() - startTimeRef.current) / 1000 + penaltyRef.current;
      setTime(Number.parseFloat(elapsed.toFixed(1)));
    }, 100);

    return stopTimer;
  }, [isActive, stopTimer]);

  useEffect(() => {
    if (isActive || isCompleted) return;
    const onKey = (e: KeyboardEvent) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        onExitToSession?.();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isActive, isCompleted, onExitToSession]);

  const initializeGame = React.useCallback(() => {
    stopTimer();
    setTime(0);
    setIsActive(false);
    setIsCompleted(false);
    setSelectedId(null);
    setNewHighScoreBadge(false);
    setItems(buildMatchItems(deckCards, gameSize));
  }, [deckCards, gameSize, stopTimer]);

  const startGame = () => {
    initializeGame();
    setIsActive(true);
  };

  const completeGame = React.useCallback(() => {
    setIsCompleted(true);
    setIsActive(false);
    stopTimer();

    const finalTime = Number.parseFloat(
      ((Date.now() - startTimeRef.current) / 1000 + penaltyRef.current).toFixed(1),
    );
    setTime(finalTime);

    celebrate({
      particleCount: 150,
      spread: 80,
      origin: { y: 0.65 },
      colors: ['#818cf8', '#6366f1', '#eab308', '#10b981'],
    });

    const stored = localStorage.getItem(`denki-match-highscore-${deckId}`);
    if (!stored || finalTime < Number.parseFloat(stored)) {
      localStorage.setItem(`denki-match-highscore-${deckId}`, String(finalTime));
      setHighScore(finalTime);
      setNewHighScoreBadge(true);

      setTimeout(() => {
        celebrate({
          particleCount: 100,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#eab308', '#6366f1'],
        });
        celebrate({
          particleCount: 100,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#eab308', '#6366f1'],
        });
      }, 500);
    }
  }, [deckId, stopTimer]);

  const handleItemClick = React.useCallback((clickedId: string) => {
    if (!isActive || isCompleted) return;

    const clickedItem = items.find(item => item.id === clickedId);
    if (!clickedItem || clickedItem.state === 'matched' || clickedItem.state === 'mismatched') return;

    if (selectedId === null) {
      setSelectedId(clickedId);
      setItems(prev => prev.map(item => item.id === clickedId ? { ...item, state: 'selected' } : item));
      return;
    }

    if (selectedId === clickedId) {
      setSelectedId(null);
      setItems(prev => prev.map(item => item.id === clickedId ? { ...item, state: 'idle' } : item));
      return;
    }

    const firstItem = items.find(item => item.id === selectedId);
    if (!firstItem) return;

    const isMatch = firstItem.cardId === clickedItem.cardId && firstItem.side !== clickedItem.side;
    if (isMatch) {
      const nextItems = items.map(item =>
        item.id === clickedId || item.id === selectedId
          ? { ...item, state: 'matched' as const }
          : item,
      );
      setItems(nextItems);
      setSelectedId(null);
      if (nextItems.length > 0 && nextItems.every(item => item.state === 'matched')) {
        completeGame();
      }
      return;
    }

    setItems(prev => prev.map(item =>
      item.id === clickedId || item.id === selectedId
        ? { ...item, state: 'mismatched' }
        : item,
    ));
    setSelectedId(null);
    penaltyRef.current += 1.5;
    setTime(prev => Number.parseFloat((prev + 1.5).toFixed(1)));

    if (mismatchResetRef.current) clearTimeout(mismatchResetRef.current);
    mismatchResetRef.current = setTimeout(() => {
      setItems(prev => prev.map(item =>
        item.state === 'mismatched' ? { ...item, state: 'idle' } : item,
      ));
    }, 500);
  }, [completeGame, isActive, isCompleted, items, selectedId]);

  if (!loading && deckCards.length < 3) {'''
          match = match[:component_start] + new_match_logic + match[component_end + len(condition_marker):]
          write('src/components/MatchGame.tsx', match)

          # Study Notepad: key the editor by deck so state initializes without a sync effect.
          write('src/components/StudyNotepad.tsx', '''import React, { useState } from 'react';
import { marked } from 'marked';
import DOMPurify from 'dompurify';

interface StudyNotepadProps {
