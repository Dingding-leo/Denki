name: Apply React 19 warning cleanup

on:
  push:
    branches:
      - fix/react-19-zero-warnings
    paths:
      - .github/workflows/apply-react19-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/react-19-zero-warnings
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract cleanup script from the previous workflow revision
        run: |
          git show HEAD^:.github/workflows/apply-react19-cleanup.yml > /tmp/cleanup-source.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/cleanup-source.yml').read_text()
          marker = "          python - <<'PY'\n"
          if marker not in source or '\n          PY\n' not in source:
              raise RuntimeError('Could not locate embedded cleanup script in parent workflow')
          script = source.split(marker, 1)[1].rsplit('\n          PY\n', 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          Path('/tmp/apply-react19-cleanup.py').write_text(normalized + '\n')
          PY
      - name: Apply refactors
        run: python /tmp/apply-react19-cleanup.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json
          git commit -m "fix(react): eliminate React 19 warnings and stale effects"
          git push origin HEAD:fix/react-19-zero-warnings
