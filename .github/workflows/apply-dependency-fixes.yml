name: Apply dependency security fixes
# Final rerun after source stabilization.

on:
  push:
    branches: [refactor/existing-function-hardening]
    paths:
      - .github/workflows/apply-dependency-fixes.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/existing-function-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking advisory fixes
        run: npm audit fix
      - name: Verify production dependencies
        run: npm audit --omit=dev
      - name: Verify complete dependency tree
        run: npm audit
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were needed"
            exit 0
          fi
          git commit -m "chore(deps): resolve current security advisories"
          git push origin HEAD:refactor/existing-function-hardening
