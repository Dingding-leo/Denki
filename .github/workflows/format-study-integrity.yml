name: Format study integrity sources

on:
  push:
    branches: [refactor/study-session-integrity]
    paths:
      - .github/workflows/format-study-integrity.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/study-session-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched store slices
        run: npx --yes prettier@3.6.2 --write src/store/slices/statsSlice.ts src/store/slices/studySlice.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit formatting
        run: |
          rm .github/workflows/format-study-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(study): format hardened session logic"
          git push origin HEAD:refactor/study-session-integrity
