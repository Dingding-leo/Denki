name: Clear closed card-manager scopes

on:
  push:
    branches: [refactor/library-loading-card-manager]
    paths:
      - .github/workflows/clear-card-scope.yml
      - scripts/clear-card-scope-on-close.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/library-loading-card-manager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/clear-card-scope-on-close.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified cleanup
        run: |
          rm .github/workflows/clear-card-scope.yml scripts/clear-card-scope-on-close.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cards): clear the active deck when the manager closes"
          git push origin HEAD:refactor/library-loading-card-manager
