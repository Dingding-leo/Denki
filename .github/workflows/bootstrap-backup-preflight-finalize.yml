name: Bootstrap backup preflight finalization

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/bootstrap-backup-preflight-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/backup-import-preflight
      - name: Finalize resource handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/modals/SettingsModal.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>^[ \t]*)const prepared = await prepareBackupImport\(parsed\);\n'
              r'(?P=indent)const summary = prepared\.summary;',
              re.MULTILINE,
          )
          replacement = (
              r'\g<indent>const prepared = await prepareBackupImport(parsed);\n'
              r'\g<indent>// The prepared plan owns normalized copies. Release the original\n'
              r'\g<indent>// parsed JSON while the user reviews media-heavy backups.\n'
              r'\g<indent>parsed = undefined;\n'
              r'\g<indent>const summary = prepared.summary;'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate the prepared-backup summary assignment.')
          path.write_text(text)
          PY
      - name: Remove one-time finalization workflow
        run: rm .github/workflows/bootstrap-backup-preflight-finalize.yml
      - name: Validate final feature tree
        run: |
          git diff --check
          npm ci
          npx tsc --noEmit
          npm run lint
          npx vitest run \
            src/services/__tests__/backup.test.ts \
            src/services/__tests__/maintenanceOperations.test.ts \
            src/components/__tests__/SettingsBackupImport.test.tsx \
            src/components/__tests__/ConfirmDialogHost.test.tsx
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/bootstrap-backup-preflight-finalize.yml
          git commit -m "chore: finalize backup preflight validation"
          git push origin HEAD:feat/backup-import-preflight
