name: Bootstrap backup preflight finalization

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/bootstrap-backup-preflight-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/backup-import-preflight
      - name: Finalize resource handling and test formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/modals/SettingsModal.tsx',
              """      const prepared = await prepareBackupImport(parsed);
              const summary = prepared.summary;""",
              """      const prepared = await prepareBackupImport(parsed);
              // The prepared plan owns normalized copies. Release the original
              // parsed JSON while the user reviews media-heavy backups.
              parsed = undefined;
              const summary = prepared.summary;""",
          )
          replace_once(
              'src/services/__tests__/backup.test.ts',
              """  });
            it('restores target retention and speech speed while clearing retired overrides'""",
              """  });

            it('restores target retention and speech speed while clearing retired overrides'""",
          )
          replace_once(
              'src/services/__tests__/maintenanceOperations.test.ts',
              """  });
            it('does not enter the restore callback when another maintenance operation owns the lease'""",
              """  });

            it('does not enter the restore callback when another maintenance operation owns the lease'""",
          )
          PY
      - name: Remove one-time finalization workflow
        run: rm .github/workflows/bootstrap-backup-preflight-finalize.yml
      - name: Validate final feature tree
        run: |
          git diff --check
          npm ci
          npx tsc --noEmit
          npm run lint
          npx vitest run \
            src/services/__tests__/backup.test.ts \
            src/services/__tests__/maintenanceOperations.test.ts \
            src/components/__tests__/SettingsBackupImport.test.tsx \
            src/components/__tests__/ConfirmDialogHost.test.tsx
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/bootstrap-backup-preflight-finalize.yml
          git commit -m "chore: finalize backup preflight validation"
          git push origin HEAD:feat/backup-import-preflight
