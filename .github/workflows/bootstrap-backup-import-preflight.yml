name: Bootstrap backup import preflight

on:
  push:
    branches: [feat/backup-import-preflight]
    paths: [.github/workflows/bootstrap-backup-import-preflight.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/backup-import-preflight
      - name: Add validated backup preview and prepared restore flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          def insert_before(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  raise SystemExit(f'Marker not found in {path}: {marker!r}')
              file.write_text(text.replace(marker, addition + marker, 1))

          def replace_range(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_index = text.find(start)
              end_index = text.find(end, start_index)
              if start_index < 0 or end_index < 0:
                  raise SystemExit(f'Range markers not found in {path}')
              file.write_text(text[:start_index] + replacement + text[end_index:])

          backup = 'src/services/backup.ts'
          replace_once(
              backup,
              """interface DatabaseSnapshotRows {
            classes: Class[];
            decks: Deck[];
            cards: Card[];
            reviews: ReviewLog[];
            media: MediaAsset[];
          }

          const isRecord""",
              """interface DatabaseSnapshotRows {
            classes: Class[];
            decks: Deck[];
            cards: Card[];
            reviews: ReviewLog[];
            media: MediaAsset[];
          }

          export interface BackupLibraryCounts {
            classes: number;
            decks: number;
            cards: number;
            reviews: number;
            media: number;
          }

          export interface BackupImportSummary extends BackupLibraryCounts {
            formatVersion: number;
            appVersion: string | null;
            databaseVersion: number | null;
            schedulerVersion: string | null;
            exportedAt: string | null;
            mediaBytes: number;
            preferences: Readonly<BackupPreferences> | null;
          }

          /**
           * Opaque, fully validated import plan. Its normalized rows stay private
           * inside this module so callers can inspect the summary without being
           * able to mutate the data that will later replace the library.
           */
          export interface PreparedBackupImport {
            readonly summary: Readonly<BackupImportSummary>;
          }

          const preparedBackupRows = new WeakMap<
            PreparedBackupImport,
            NormalizedBackup
          >();

          const isRecord""",
          )

          replace_once(
              backup,
              """const isValidDate = (value: unknown): value is Date =>
            value instanceof Date && Number.isFinite(value.getTime());

          function reviveDateValue""",
              """const isValidDate = (value: unknown): value is Date =>
            value instanceof Date && Number.isFinite(value.getTime());

          function optionalCanonicalIsoDate(value: unknown): string | null {
            if (typeof value !== 'string') return null;
            const parsed = new Date(value);
            if (!Number.isFinite(parsed.getTime())) return null;
            return parsed.toISOString() === value ? value : null;
          }

          function reviveDateValue""",
          )

          insert_before(
              backup,
              'function applyPreferences(',
              """function createBackupImportSummary(
            snapshot: unknown,
            normalized: NormalizedBackup,
          ): BackupImportSummary {
            if (!isRecord(snapshot)) {
              throw new Error('Backup preview could not be created.');
            }

            const rawDatabaseVersion =
              snapshot.databaseVersion ?? snapshot.version;
            const preferences = normalized.preferences
              ? Object.freeze({ ...normalized.preferences })
              : null;

            return {
              formatVersion: Number(snapshot.formatVersion ?? 1),
              appVersion:
                typeof snapshot.appVersion === 'string'
                  ? snapshot.appVersion
                  : null,
              databaseVersion:
                typeof rawDatabaseVersion === 'number'
                  ? rawDatabaseVersion
                  : null,
              schedulerVersion:
                typeof snapshot.schedulerVersion === 'string'
                  ? snapshot.schedulerVersion
                  : null,
              exportedAt: optionalCanonicalIsoDate(snapshot.exportedAt),
              classes: normalized.classes.length,
              decks: normalized.decks.length,
              cards: normalized.cards.length,
              reviews: normalized.reviews.length,
              media: normalized.media.length,
              mediaBytes: normalized.media.reduce(
                (total, asset) => total + asset.byteLength,
                0,
              ),
              preferences,
            };
          }

          /**
           * Fully validate a portable backup before asking the user to replace
           * local data. Media hashes, scheduler provenance, dates, relationships,
           * and preferences are all checked exactly once.
           */
          export async function prepareBackupImport(
            snapshot: unknown,
          ): Promise<PreparedBackupImport> {
            const normalized = await normalizeBackup(snapshot);
            const summary = Object.freeze(
              createBackupImportSummary(snapshot, normalized),
            );
            const prepared = Object.freeze({ summary });
            preparedBackupRows.set(prepared, normalized);
            return prepared;
          }

          """,
          )

          replacement = """/**
           * Replace all five persistent tables from rows that already passed the
           * complete backup validator. Preference writes are rolled back if the
           * durable replacement transaction fails.
           */
          async function replaceDatabase(
            normalized: NormalizedBackup,
          ): Promise<void> {
            const { classes, decks, cards, reviews, media, preferences } =
              normalized;
            const rollbackPreferences = applyPreferences(preferences);

            try {
              await db.transaction(
                'rw',
                [db.classes, db.decks, db.cards, db.reviews, db.media],
                async () => {
                  await Promise.all([
                    db.classes.clear(),
                    db.decks.clear(),
                    db.cards.clear(),
                    db.reviews.clear(),
                    db.media.clear(),
                  ]);

                  if (classes.length > 0) await db.classes.bulkAdd(classes);
                  if (decks.length > 0) await db.decks.bulkAdd(decks);
                  if (cards.length > 0) await db.cards.bulkAdd(cards);
                  if (reviews.length > 0) await db.reviews.bulkAdd(reviews);
                  if (media.length > 0) await db.media.bulkAdd(media);
                },
              );
            } catch (error) {
              if (rollbackPreferences) {
                try {
                  rollbackPreferences();
                } catch (rollbackError) {
                  console.warn(
                    'Unable to roll back restored preferences:',
                    rollbackError,
                  );
                }
              }
              throw error;
            }

            // Durable replacement succeeded. Existing object URLs point at the
            // old registry generation and must not survive into the restored library.
            try {
              revokeAllMediaObjectUrls();
            } catch (error) {
              console.warn('Unable to revoke stale media object URLs:', error);
            }
            clearPersistedStudySession();
            triggerAutoSave();
          }

          /** Apply one opaque, prevalidated import plan exactly once. */
          export async function importPreparedDatabase(
            prepared: PreparedBackupImport,
          ): Promise<void> {
            const normalized = preparedBackupRows.get(prepared);
            if (!normalized) {
              throw new Error(
                'Backup import preview is invalid or has already been used.',
              );
            }

            try {
              await replaceDatabase(normalized);
            } finally {
              preparedBackupRows.delete(prepared);
            }
          }

          /** Validate and replace the library without an interactive preview. */
          export async function importDatabase(snapshot: unknown): Promise<void> {
            const prepared = await prepareBackupImport(snapshot);
            await importPreparedDatabase(prepared);
          }

          """
          replace_range(
              backup,
              '/**\n * Replace all five persistent tables from a fully validated backup.',
              'async function saveToFilesystem',
              replacement,
          )

          operations = 'src/services/maintenanceOperations.ts'
          replace_once(
              operations,
              "import { importDatabase } from './backup';",
              """import {
            importDatabase,
            importPreparedDatabase,
            type PreparedBackupImport,
          } from './backup';""",
          )
          Path(operations).write_text(
              Path(operations).read_text().rstrip()
              + """

          /**
           * Apply a backup that was fully validated before the user confirmed the
           * destructive restore. The opaque plan is committed only after this tab
           * acquires the same origin-wide maintenance lease as legacy callers.
           */
          export async function importPreparedDatabaseExclusively(
            prepared: PreparedBackupImport,
          ): Promise<void> {
            return withExclusiveMaintenanceLock(
              {
                operation: 'backup-restore',
                label: 'Portable backup restore',
              },
              async ({ assertOwned }) => {
                await assertOwned();
                await importPreparedDatabase(prepared);
              },
            );
          }
          """
          )

          ui_store = 'src/store/uiStore.ts'
          replace_once(
              ui_store,
              """export interface ConfirmOptions {
            title: string;
            message: string;
            confirmLabel?: string;
            cancelLabel?: string;
            danger?: boolean;
          }""",
              """export interface ConfirmDetail {
            label: string;
            value: string;
          }

          export interface ConfirmOptions {
            title: string;
            message: string;
            details?: readonly ConfirmDetail[];
            confirmLabel?: string;
            cancelLabel?: string;
            danger?: boolean;
          }""",
          )
          replace_once(
              ui_store,
              "set({ pendingConfirm: { ...options, resolve } });",
              """set({
                pendingConfirm: {
                  ...options,
                  details: options.details?.map((detail) => ({ ...detail })),
                  resolve,
                },
              });""",
          )

          confirm_host = 'src/components/ui/ConfirmDialogHost.tsx'
          replace_once(
              confirm_host,
              'aria-describedby="confirm-dialog-message"',
              """aria-describedby={
                  pending.details && pending.details.length > 0
                    ? 'confirm-dialog-message confirm-dialog-details'
                    : 'confirm-dialog-message'
                }""",
          )
          replace_once(
              confirm_host,
              """        <p id="confirm-dialog-message" style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.55 }}>
                  {pending.message}
                </p>

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '4px' }}>""",
              """        <p id="confirm-dialog-message" style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.55 }}>
                  {pending.message}
                </p>

                {pending.details && pending.details.length > 0 && (
                  <dl
                    id="confirm-dialog-details"
                    style={{
                      display: 'grid',
                      gap: '8px',
                      margin: 0,
                      padding: '12px',
                      border: '1px solid rgba(255, 255, 255, 0.1)',
                      background: 'rgba(255, 255, 255, 0.035)',
                    }}
                  >
                    {pending.details.map((detail, index) => (
                      <div
                        key={`${detail.label}-${index}`}
                        style={{
                          display: 'grid',
                          gridTemplateColumns: 'minmax(92px, 0.7fr) minmax(0, 1.3fr)',
                          gap: '12px',
                          alignItems: 'start',
                        }}
                      >
                        <dt
                          style={{
                            color: 'var(--text-muted)',
                            fontSize: '11px',
                            fontWeight: 700,
                          }}
                        >
                          {detail.label}
                        </dt>
                        <dd
                          style={{
                            margin: 0,
                            color: 'var(--text-primary)',
                            fontSize: '12px',
                            lineHeight: 1.45,
                            overflowWrap: 'anywhere',
                          }}
                        >
                          {detail.value}
                        </dd>
                      </div>
                    ))}
                  </dl>
                )}

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '4px' }}>""",
          )

          settings = 'src/components/modals/SettingsModal.tsx'
          replace_once(
              settings,
              """import {
            downloadBackup,
            type BackupSnapshot,
          } from '../../services/backup';""",
              """import {
            downloadBackup,
            prepareBackupImport,
            type BackupImportSummary,
          } from '../../services/backup';""",
          )
          replace_once(
              settings,
              "import { importDatabaseExclusively } from '../../services/maintenanceOperations';",
              "import { importPreparedDatabaseExclusively } from '../../services/maintenanceOperations';",
          )
          insert_before(
              settings,
              'export const SettingsModal:',
              """type ImportPhase = 'idle' | 'inspecting' | 'restoring';

          function formatByteCount(bytes: number): string {
            if (bytes < 1024) return `${bytes.toLocaleString()} B`;
            const kibibytes = bytes / 1024;
            if (kibibytes < 1024) return `${kibibytes.toFixed(1)} KiB`;
            return `${(kibibytes / 1024).toFixed(1)} MiB`;
          }

          function formatBackupTimestamp(value: string | null): string {
            if (!value) return 'Not recorded';
            return new Date(value).toLocaleString();
          }

          function backupSourceLabel(summary: BackupImportSummary): string {
            return summary.appVersion
              ? `Denki ${summary.appVersion} · format ${summary.formatVersion}`
              : `Legacy Denki backup · format ${summary.formatVersion}`;
          }

          function backupPreferenceLabel(summary: BackupImportSummary): string {
            if (!summary.preferences) {
              return 'Not included; current preferences stay unchanged';
            }
            return `${Math.round(summary.preferences.requestRetention * 100)}% target retention · ${summary.preferences.speechSpeed.toFixed(1)}× speech`;
          }

          """,
          )
          replace_once(
              settings,
              "const [importing, setImporting] = useState(false);",
              """const [importPhase, setImportPhase] = useState<ImportPhase>('idle');
            const importing = importPhase !== 'idle';""",
          )
          replace_once(
              settings,
              """  const handleImportFile = async (
              event: React.ChangeEvent<HTMLInputElement>,
            ) => {
              const file = event.target.files?.[0];
              event.target.value = '';
              if (!file || importing || optimizingMedia) return;

              const confirmed = await confirmDialog({
                title: 'Import portable backup',
                message:
                  'This replaces every current class, deck, card, review log, media object, and active study queue. When included, target retention and speech speed are restored too; your AI-provider key remains unchanged. This cannot be undone.',
                confirmLabel: 'Replace data & preferences',
                danger: true,
              });
              if (!confirmed) return;

              setImporting(true);
              try {
                const parsed: unknown = JSON.parse(await file.text());
                await importDatabaseExclusively(parsed as BackupSnapshot);
                try {
                  clearEmbeddedMediaMigrationCursor();
                } catch (error) {
                  console.warn('Unable to clear stale media-migration progress:', error);
                }
                toast('Backup restored. Reloading Denki…', 'success');
                scheduleApplicationReload();
              } catch (error) {
                toast(
                  `Import failed: ${error instanceof Error ? error.message : 'invalid backup file'}`,
                  'error',
                );
              } finally {
                setImporting(false);
              }
            };""",
              """  const handleImportFile = async (
              event: React.ChangeEvent<HTMLInputElement>,
            ) => {
              const file = event.target.files?.[0];
              event.target.value = '';
              if (!file || importing || optimizingMedia || exporting) return;

              setImportPhase('inspecting');
              try {
                let parsed: unknown;
                try {
                  parsed = JSON.parse(await file.text());
                } catch (error) {
                  throw new Error('Backup file is not valid JSON.', {
                    cause: error,
                  });
                }

                const prepared = await prepareBackupImport(parsed);
                const summary = prepared.summary;
                const confirmed = await confirmDialog({
                  title: 'Restore this validated backup?',
                  message:
                    'This file passed Denki’s complete schema, relationship, scheduler-provenance, and media-integrity checks. Restoring it replaces the entire local library and active study queue on this device. This cannot be undone.',
                  details: [
                    { label: 'File', value: file.name },
                    { label: 'Backup source', value: backupSourceLabel(summary) },
                    {
                      label: 'Exported',
                      value: formatBackupTimestamp(summary.exportedAt),
                    },
                    {
                      label: 'Contents',
                      value: `${summary.classes.toLocaleString()} classes · ${summary.decks.toLocaleString()} decks · ${summary.cards.toLocaleString()} cards · ${summary.reviews.toLocaleString()} reviews`,
                    },
                    {
                      label: 'Media',
                      value: `${summary.media.toLocaleString()} objects · ${formatByteCount(summary.mediaBytes)}`,
                    },
                    {
                      label: 'Preferences',
                      value: backupPreferenceLabel(summary),
                    },
                  ],
                  confirmLabel: 'Replace local library',
                  danger: true,
                });
                if (!confirmed) return;

                setImportPhase('restoring');
                await importPreparedDatabaseExclusively(prepared);
                try {
                  clearEmbeddedMediaMigrationCursor();
                } catch (error) {
                  console.warn('Unable to clear stale media-migration progress:', error);
                }
                toast('Backup restored. Reloading Denki…', 'success');
                scheduleApplicationReload();
              } catch (error) {
                toast(
                  `Import failed: ${error instanceof Error ? error.message : 'invalid backup file'}`,
                  'error',
                );
              } finally {
                setImportPhase('idle');
              }
            };""",
          )
          replace_once(
              settings,
              """  const migrationButtonLabel = optimizingMedia
              ? stoppingMedia
                ? 'Stopping after batch…'
                : 'Stop after current batch'
              : migrationStatus?.phase === 'complete'
                ? 'Scan again'
                : migrationStatus
                  ? 'Resume optimization'
                  : 'Optimize media';""",
              """  const migrationButtonLabel = optimizingMedia
              ? stoppingMedia
                ? 'Stopping after batch…'
                : 'Stop after current batch'
              : migrationStatus?.phase === 'complete'
                ? 'Scan again'
                : migrationStatus
                  ? 'Resume optimization'
                  : 'Optimize media';

            const importButtonLabel =
              importPhase === 'inspecting'
                ? 'Inspecting…'
                : importPhase === 'restoring'
                  ? 'Restoring…'
                  : 'Import backup';""",
          )
          replacements = {
              'if (optimizingMedia) return;': 'if (optimizingMedia || importing) return;',
              'if (exporting || optimizingMedia) return;': 'if (exporting || optimizingMedia || importing) return;',
              '!optimizingMedia\n        )': '!optimizingMedia &&\n          !importing\n        )',
              'disabled={optimizingMedia}': 'disabled={optimizingMedia || importing}',
              "<Upload size={13} /> {importing ? 'Validating…' : 'Import backup'}": '<Upload size={13} /> {importButtonLabel}',
          }
          for old, new in replacements.items():
              text = Path(settings).read_text()
              if old not in text:
                  raise SystemExit(f'Expected Settings token not found: {old!r}')
              Path(settings).write_text(text.replace(old, new))

          backup_test = 'src/services/__tests__/backup.test.ts'
          replace_once(
              backup_test,
              "import { SPEECH_SPEED_KEY } from '../speech';",
              """import { SPEECH_SPEED_KEY } from '../speech';
          import { registerMediaBytes } from '../mediaRegistry';""",
          )
          replace_once(
              backup_test,
              """  BACKUP_FORMAT_VERSION,
            exportDatabase,
            importDatabase,
          } from '../backup';""",
              """  BACKUP_FORMAT_VERSION,
            exportDatabase,
            importDatabase,
            importPreparedDatabase,
            prepareBackupImport,
          } from '../backup';""",
          )
          replace_once(
              backup_test,
              """      db.decks.clear(),
                db.classes.clear(),
              ]);""",
              """      db.decks.clear(),
                db.classes.clear(),
                db.media.clear(),
              ]);""",
          )
          insert_before(
              backup_test,
              "  it('restores target retention and speech speed while clearing retired overrides'",
              """  it('prepares a validated one-shot import summary before replacing data', async () => {
            const { cardId } = await seedCard('preview-source');
            await registerMediaBytes(
              'image/png',
              new Uint8Array([1, 2, 3, 4]),
            );
            localStorage.setItem(RETENTION_KEY, '0.87');
            localStorage.setItem(SPEECH_SPEED_KEY, '1.3');
            const snapshot = JSON.parse(JSON.stringify(await exportDatabase()));

            const prepared = await prepareBackupImport(snapshot);

            expect(prepared.summary).toMatchObject({
              formatVersion: BACKUP_FORMAT_VERSION,
              appVersion: snapshot.appVersion,
              databaseVersion: db.verno,
              schedulerVersion: FSRS_VERSION,
              exportedAt: snapshot.exportedAt,
              classes: 1,
              decks: 1,
              cards: 1,
              reviews: 0,
              media: 1,
              mediaBytes: 4,
              preferences: {
                requestRetention: 0.87,
                speechSpeed: 1.3,
              },
            });

            await db.cards.update(cardId, { front: 'changed after preview' });
            await importPreparedDatabase(prepared);
            expect((await db.cards.get(cardId))?.front).toBe('preview-source');
            await expect(importPreparedDatabase(prepared)).rejects.toThrow(
              /already been used/i,
            );
          });

          """,
          )

          maintenance_test = 'src/services/__tests__/maintenanceOperations.test.ts'
          replace_once(
              maintenance_test,
              """const mocks = vi.hoisted(() => ({
            importDatabase: vi.fn(),
          }));""",
              """const mocks = vi.hoisted(() => ({
            importDatabase: vi.fn(),
            importPreparedDatabase: vi.fn(),
          }));""",
          )
          replace_once(
              maintenance_test,
              """vi.mock('../backup', () => ({
            importDatabase: mocks.importDatabase,
          }));""",
              """vi.mock('../backup', () => ({
            importDatabase: mocks.importDatabase,
            importPreparedDatabase: mocks.importPreparedDatabase,
          }));""",
          )
          replace_once(
              maintenance_test,
              "import { importDatabaseExclusively } from '../maintenanceOperations';",
              """import {
            importDatabaseExclusively,
            importPreparedDatabaseExclusively,
          } from '../maintenanceOperations';""",
          )
          replace_once(
              maintenance_test,
              'mocks.importDatabase.mockReset();',
              """mocks.importDatabase.mockReset();
              mocks.importPreparedDatabase.mockReset();""",
          )
          insert_before(
              maintenance_test,
              "  it('does not enter the restore callback when another maintenance operation owns the lease'",
              """  it('holds the lease while applying a prevalidated import plan', async () => {
            let finishRestore: (() => void) | undefined;
            let restoreStarted: (() => void) | undefined;
            const started = new Promise<void>((resolve) => {
              restoreStarted = resolve;
            });
            const prepared = { summary: {} } as never;

            mocks.importPreparedDatabase.mockImplementation(async () => {
              restoreStarted?.();
              await new Promise<void>((resolve) => {
                finishRestore = resolve;
              });
            });

            const restore = importPreparedDatabaseExclusively(prepared);
            await started;

            await expect(
              withExclusiveMaintenanceLock(
                {
                  operation: 'competing-maintenance',
                  label: 'Competing maintenance',
                },
                async () => undefined,
              ),
            ).rejects.toBeInstanceOf(MaintenanceLockUnavailableError);
            expect(mocks.importPreparedDatabase).toHaveBeenCalledWith(prepared);

            finishRestore?.();
            await restore;
          });

          """,
          )

          Path('src/components/__tests__/SettingsBackupImport.test.tsx').write_text("""import { act, fireEvent, render, screen, waitFor } from '@testing-library/react';
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
          import { useFlashcardStore } from '../../store/useFlashcardStore';

          const mocks = vi.hoisted(() => ({
            prepare: vi.fn(),
            restore: vi.fn(),
            confirm: vi.fn(),
            toast: vi.fn(),
            clearCursor: vi.fn(),
            reload: vi.fn(),
            celebrate: vi.fn(),
          }));

          vi.mock('../../services/backup', () => ({
            downloadBackup: vi.fn(),
            prepareBackupImport: mocks.prepare,
          }));

          vi.mock('../../services/maintenanceOperations', () => ({
            importPreparedDatabaseExclusively: mocks.restore,
          }));

          vi.mock('../../services/embeddedMediaMigration', () => ({
            clearEmbeddedMediaMigrationCursor: mocks.clearCursor,
            getEmbeddedMediaMigrationStatus: () => null,
            migrateEmbeddedMediaToCompletion: vi.fn(),
          }));

          vi.mock('../../store/uiStore', () => ({
            confirmDialog: mocks.confirm,
            toast: mocks.toast,
          }));

          vi.mock('../../services/appReload', () => ({
            scheduleApplicationReload: mocks.reload,
          }));

          vi.mock('../../services/celebrate', () => ({
            celebrate: mocks.celebrate,
          }));

          import { SettingsModal } from '../modals/SettingsModal';

          const prepared = {
            summary: {
              formatVersion: 5,
              appVersion: '0.1.0',
              databaseVersion: 8,
              schedulerVersion: '4.5',
              exportedAt: '2026-08-21T12:00:00.000Z',
              classes: 3,
              decks: 17,
              cards: 824,
              reviews: 2941,
              media: 12,
              mediaBytes: 8 * 1024 * 1024,
              preferences: {
                requestRetention: 0.9,
                speechSpeed: 1.2,
              },
            },
          };

          function backupFile(source = '{\"formatVersion\":5}'): File {
            return {
              name: 'denki-backup-2026-08-21.json',
              text: vi.fn(async () => source),
            } as unknown as File;
          }

          function chooseFile(file: File): void {
            const input = document.querySelector(
              'input[type="file"]',
            ) as HTMLInputElement | null;
            if (!input) throw new Error('Backup file input not found.');
