name: Apply corrected auto-speech patch

on:
  push:
    branches: [fix/auto-read-question]
    paths:
      - .github/workflows/final-auto-speech-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-read-question
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch speech lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/Flashcard.tsx')
          text = path.read_text()
          old_voice_state = "  const [selectedVoice, setSelectedVoice] = useState<SpeechSynthesisVoice | null>(null);"
          assert old_voice_state in text
          text = text.replace(old_voice_state, "  const selectedVoiceRef = useRef<SpeechSynthesisVoice | null>(null);", 1)

          voice_start = text.index('  // Setup speech synthesis voices once on mount and handle cleanup')
          voice_end = text.index('  // Reset scratchpad state during render', voice_start)
          voice_block = '''  // Cache the preferred English voice without putting it in React state. Voice
          // discovery is asynchronous in some browsers; a ref avoids re-running the
          // auto-speech effect (and speaking the same side twice) when voices arrive.
          useEffect(() => {
            if (!(\'speechSynthesis\' in window)) return;

            const loadVoice = () => {
              const voices = window.speechSynthesis.getVoices();
              selectedVoiceRef.current =
                voices.find((voice) => voice.lang.startsWith(\'en\') && voice.name.includes(\'Google\')) ??
                voices.find((voice) => voice.lang.startsWith(\'en\')) ??
                null;
            };

            loadVoice();
            window.speechSynthesis.addEventListener(\'voiceschanged\', loadVoice);
            return () => window.speechSynthesis.removeEventListener(\'voiceschanged\', loadVoice);
          }, []);

          '''
          text = text[:voice_start] + voice_block + text[voice_end:]

          speech_start = text.index('  // Helper function to synthesize speech')
          speech_end = text.index('  // Cleanup speech on unmount', speech_start)
          speech_block = '''  // Helper function to synthesize speech. This callback stays stable so voice
          // discovery cannot retrigger an already-spoken question or answer.
          const speakText = React.useCallback((textToRead: string) => {
            const cleanText = textToRead
              .replace(/\\{\\{c\\d+::(.*?)\\}\\}/g, '$1')
              .replace(/```[\\s\\S]*?```/g, '')
              .replace(/[`*#_-]/g, ' ')
              .replace(/\\s+/g, ' ')
              .trim();

            if (!cleanText || !(\'speechSynthesis\' in window)) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';

            const fallbackVoice = window.speechSynthesis
              .getVoices()
              .find((voice) => voice.lang.startsWith('en'));
            utterance.voice = selectedVoiceRef.current ?? fallbackVoice ?? null;

            const savedSpeed = Number.parseFloat(localStorage.getItem('denki-speech-speed') ?? '1.0');
            utterance.rate = Number.isFinite(savedSpeed) ? savedSpeed : 1;
            window.speechSynthesis.speak(utterance);
          }, []);

          const autoSpeechTimerRef = useRef<number | null>(null);

          // A newly advanced card briefly inherits the previous card's flipped
          // state. Defer speech for one task so the stale answer read is cancelled
          // and the settled front/question is spoken instead.
          useEffect(() => {
            if (autoSpeechTimerRef.current !== null) {
              window.clearTimeout(autoSpeechTimerRef.current);
              autoSpeechTimerRef.current = null;
            }

            if (!autoSpeak) {
              if ('speechSynthesis' in window) window.speechSynthesis.cancel();
              return;
            }

            const textToSpeak = isFlipped ? card.back : card.front;
            autoSpeechTimerRef.current = window.setTimeout(() => {
              autoSpeechTimerRef.current = null;
              speakText(textToSpeak);
            }, 0);

            return () => {
              if (autoSpeechTimerRef.current !== null) {
                window.clearTimeout(autoSpeechTimerRef.current);
                autoSpeechTimerRef.current = null;
              }
            };
          }, [card.id, card.front, card.back, isFlipped, autoSpeak, speakText]);

          '''
          text = text[:speech_start] + speech_block + text[speech_end:]

          old_cleanup = '''  useEffect(() => {
            return () => {
              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
              }
            };
          }, []);'''
          new_cleanup = '''  useEffect(() => {
            return () => {
              if (autoSpeechTimerRef.current !== null) {
                window.clearTimeout(autoSpeechTimerRef.current);
              }
              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
              }
            };
          }, []);'''
          assert old_cleanup in text
          text = text.replace(old_cleanup, new_cleanup, 1)

          front_label = '                  aria-label="Pronounce text"\n                  title="Pronounce English Text"'
          back_label = '                aria-label="Pronounce text"\n                title="Pronounce English Text"'
          assert front_label in text
          assert back_label in text
          text = text.replace(front_label, '                  aria-label="Read question aloud"\n                  title="Read Question Aloud"', 1)
          text = text.replace(back_label, '                aria-label="Read answer aloud"\n                title="Read Answer Aloud"', 1)
          path.write_text(text)

          session_path = Path('src/pages/StudySessionPage.tsx')
          session = session_path.read_text()
          assert 'aria-label="Auto-pronounce answers"' in session
          session = session.replace('aria-label="Auto-pronounce answers"', 'aria-label="Automatically read questions and answers"', 1)
          session = session.replace(
              "title={`Auto Pronounce English (${autoSpeak ? 'ON' : 'OFF'})`}",
              "title={`Auto-read Questions and Answers (${autoSpeak ? 'ON' : 'OFF'})`}",
              1,
          )
          session_path.write_text(session)
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Flashcard.tsx src/pages/StudySessionPage.tsx
          git commit -m "fix(study): auto-read each new question"
          git push origin HEAD:fix/auto-read-question
