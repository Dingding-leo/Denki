name: Bootstrap locked backup restore

on:
  push:
    branches: [fix/lock-full-backup-restore]
    paths: [.github/workflows/bootstrap-lock-backup-restore.yml]

permissions:
  contents: write

jobs:
  wire-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lock-full-backup-restore
      - name: Route the Settings restore through the exclusive maintenance lease
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/modals/SettingsModal.tsx')
          text = path.read_text()
          old_import = """import {
            downloadBackup,
            importDatabase,
            type BackupSnapshot,
          } from '../../services/backup';"""
          new_import = """import {
            downloadBackup,
            type BackupSnapshot,
          } from '../../services/backup';"""
          if old_import not in text:
              raise SystemExit('Expected backup import block was not found.')
          text = text.replace(old_import, new_import, 1)

          anchor = "import { scheduleApplicationReload } from '../../services/appReload';"
          addition = anchor + "\nimport { importDatabaseExclusively } from '../../services/maintenanceOperations';"
          if anchor not in text:
              raise SystemExit('Expected appReload import was not found.')
          text = text.replace(anchor, addition, 1)

          old_call = 'await importDatabase(parsed as BackupSnapshot);'
          new_call = 'await importDatabaseExclusively(parsed as BackupSnapshot);'
          if old_call not in text:
              raise SystemExit('Expected direct import call was not found.')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-lock-backup-restore.yml
      - name: Commit the focused wiring change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modals/SettingsModal.tsx .github/workflows/bootstrap-lock-backup-restore.yml
          git commit -m "fix: lock portable backup restore across tabs"
          git push origin HEAD:fix/lock-full-backup-restore
