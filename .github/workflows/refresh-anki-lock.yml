name: Refresh Anki dependency lockfile

on:
  push:
    branches: [feat/offline-atomic-anki-import]
    paths:
      - .github/workflows/refresh-anki-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-atomic-anki-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact jszip@3.10.1 sql.js@1.14.1
      - run: npm install --save-dev --save-exact @types/sql.js@latest
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency metadata changes"
            exit 0
          fi
          git commit -m "chore(deps): bundle Anki import dependencies"
          git push origin HEAD:feat/offline-atomic-anki-import
