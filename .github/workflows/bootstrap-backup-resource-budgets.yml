name: Bootstrap backup resource budgets

on:
  push:
    branches: [security/backup-resource-budgets]
    paths: [.github/workflows/bootstrap-backup-resource-budgets.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          def insert_before(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  raise SystemExit(f'Marker not found in {path}: {marker!r}')
              file.write_text(text.replace(marker, addition + marker, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Pattern did not match exactly once in {path}: {pattern[:100]!r}')
              file.write_text(updated)

          backup = 'src/services/backup.ts'
          replace_once(
              backup,
              "import { markBackupExported } from './dataSafety';\n",
              "import { markBackupExported } from './dataSafety';\n"
              "import {\n"
              "  parseBackupJsonText,\n"
              "  serializeBackupJson,\n"
              "} from './backupFile';\n",
          )
          replace_once(
              backup,
              "export const BACKUP_FORMAT_VERSION = 5;\n\n",
              textwrap.dedent("""\
              export const BACKUP_FORMAT_VERSION = 5;

              const MEBIBYTE = 1024 * 1024;
              export const BACKUP_RESOURCE_LIMITS = {
                maxClasses: 10_000,
                maxDecks: 50_000,
                maxCards: 250_000,
                maxReviews: 2_000_000,
                maxMediaRows: 5_000,
                maxClassNameCharacters: 64 * 1024,
                maxClassDescriptionCharacters: 4 * MEBIBYTE,
                maxDeckNameCharacters: 64 * 1024,
                maxDeckDescriptionCharacters: 4 * MEBIBYTE,
                maxDeckNotesCharacters: 8 * MEBIBYTE,
                maxCardFieldCharacters: 4 * MEBIBYTE,
                maxTotalTextCharacters: 96 * MEBIBYTE,
              } as const;

              """),
          )

          helpers = textwrap.dedent("""\
          function assertBackupTableLimit(
            rows: unknown[],
            label: string,
            maximum: number,
          ): void {
            if (rows.length > maximum) {
              throw new Error(
                `Backup contains more than ${maximum.toLocaleString('en-US')} ${label}; refusing to import.`,
              );
            }
          }

          function accountBackupText(
            value: unknown,
            label: string,
            maximum: number,
            budget: { total: number },
          ): void {
            if (typeof value !== 'string') return;
            if (value.length > maximum) {
              throw new Error(
                `${label} exceeds the ${maximum.toLocaleString('en-US')} character limit; refusing to import.`,
              );
            }

            budget.total += value.length;
            if (budget.total > BACKUP_RESOURCE_LIMITS.maxTotalTextCharacters) {
              throw new Error(
                `Backup text exceeds the ${BACKUP_RESOURCE_LIMITS.maxTotalTextCharacters.toLocaleString('en-US')} character total limit; refusing to import.`,
              );
            }
          }

          function assertBackupResourceBudget(
            data: Record<string, unknown>,
          ): void {
            const classes = data.classes as unknown[];
            const decks = data.decks as unknown[];
            const cards = data.cards as unknown[];
            const reviews = data.reviews as unknown[];

            assertBackupTableLimit(
              classes,
              'classes',
              BACKUP_RESOURCE_LIMITS.maxClasses,
            );
            assertBackupTableLimit(
              decks,
              'decks',
              BACKUP_RESOURCE_LIMITS.maxDecks,
            );
            assertBackupTableLimit(
              cards,
              'cards',
              BACKUP_RESOURCE_LIMITS.maxCards,
            );
            assertBackupTableLimit(
              reviews,
              'reviews',
              BACKUP_RESOURCE_LIMITS.maxReviews,
            );
            if (Array.isArray(data.media)) {
              assertBackupTableLimit(
                data.media,
                'media objects',
                BACKUP_RESOURCE_LIMITS.maxMediaRows,
              );
            }

            const budget = { total: 0 };
            classes.forEach((row, index) => {
              if (!isRecord(row)) return;
              accountBackupText(
                row.name,
                `Backup class ${index + 1} name`,
                BACKUP_RESOURCE_LIMITS.maxClassNameCharacters,
                budget,
              );
              accountBackupText(
                row.description,
                `Backup class ${index + 1} description`,
                BACKUP_RESOURCE_LIMITS.maxClassDescriptionCharacters,
                budget,
              );
            });
            decks.forEach((row, index) => {
              if (!isRecord(row)) return;
              accountBackupText(
                row.name,
                `Backup deck ${index + 1} name`,
                BACKUP_RESOURCE_LIMITS.maxDeckNameCharacters,
                budget,
              );
              accountBackupText(
                row.description,
                `Backup deck ${index + 1} description`,
                BACKUP_RESOURCE_LIMITS.maxDeckDescriptionCharacters,
                budget,
              );
              accountBackupText(
                row.notes,
                `Backup deck ${index + 1} notes`,
                BACKUP_RESOURCE_LIMITS.maxDeckNotesCharacters,
                budget,
              );
            });
            cards.forEach((row, index) => {
              if (!isRecord(row)) return;
              accountBackupText(
                row.front,
                `Backup card ${index + 1} front`,
                BACKUP_RESOURCE_LIMITS.maxCardFieldCharacters,
                budget,
              );
              accountBackupText(
                row.back,
                `Backup card ${index + 1} back`,
                BACKUP_RESOURCE_LIMITS.maxCardFieldCharacters,
                budget,
              );
            });
          }

          """)
          insert_before(backup, 'function reviveDateValue', helpers)
          insert_before(
              backup,
              "  const classes = reviveDates(data.classes as unknown[], ['createdAt']);",
              '  assertBackupResourceBudget(data);\n\n',
          )
          replace_once(
              backup,
              '      body: JSON.stringify(snapshot),',
              '      body: serializeBackupJson(snapshot),',
          )
          replace_once(
              backup,
              '    const snapshot: unknown = await response.json();',
              '    const snapshot: unknown = parseBackupJsonText(await response.text());',
          )
          replace_once(
              backup,
              "  const blob = new Blob([JSON.stringify(snapshot, null, 2)], {\n"
              "    type: 'application/json',\n"
              "  });",
              "  const json = serializeBackupJson(snapshot);\n"
              "  const blob = new Blob([json], {\n"
              "    type: 'application/json',\n"
              "  });",
          )

          settings = 'src/components/modals/SettingsModal.tsx'
          replace_once(
              settings,
              "} from '../../services/backup';\n"
              "import { scheduleApplicationReload }",
              "} from '../../services/backup';\n"
              "import { readBackupJsonFile } from '../../services/backupFile';\n"
              "import { scheduleApplicationReload }",
          )
          regex_once(
              settings,
              r"      let parsed: unknown;\n"
              r"      try \{\n"
              r"        parsed = JSON\.parse\(await file\.text\(\)\);\n"
              r"      \} catch \(error\) \{\n"
              r"        throw new Error\('Backup file is not valid JSON\.', \{\n"
              r"          cause: error,\n"
              r"        \}\);\n"
              r"      \}\n\n"
              r"      const prepared = await prepareBackupImport\(parsed\);",
              "      let parsed: unknown = await readBackupJsonFile(file);\n\n"
              "      const prepared = await prepareBackupImport(parsed);",
          )

          settings_test = 'src/components/__tests__/SettingsBackupImport.test.tsx'
          replace_once(
              settings_test,
              "  return {\n"
              "    name: 'denki-backup-2026-08-21.json',\n"
              "    text: vi.fn(async () => source),\n"
              "  } as unknown as File;",
              "  return {\n"
              "    name: 'denki-backup-2026-08-21.json',\n"
              "    size: new Blob([source]).size,\n"
              "    text: vi.fn(async () => source),\n"
              "  } as unknown as File;",
          )
          PY
