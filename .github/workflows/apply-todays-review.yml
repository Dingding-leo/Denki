name: Apply today's mixed review

on:
  push:
    branches: [feat/todays-mixed-review]
    paths:
      - .github/workflows/apply-todays-review.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/todays-mixed-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed implementation
        env:
          PATCH_B64: 
      - name: Run implementation script
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          source = gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode()
          exec(compile(source, '<denki-today-queue>', 'exec'))
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add today's mixed review queue"
          git push origin HEAD:feat/todays-mixed-review
