name: Apply auto-speech transition fix

on:
  push:
    branches: [fix/auto-read-question]
    paths:
      - .github/workflows/apply-auto-speech-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-read-question
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply speech lifecycle fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          flashcard_path = Path('src/components/Flashcard.tsx')
          text = flashcard_path.read_text()

          text = text.replace(
              "  const [selectedVoice, setSelectedVoice] = useState<SpeechSynthesisVoice | null>(null);",
              "  const selectedVoiceRef = useRef<SpeechSynthesisVoice | null>(null);",
              1,
          )

          voice_block = '''  // Cache the preferred English voice without putting it in React state. Voice
          // discovery is asynchronous in some browsers; a ref avoids re-running the
          // auto-speech effect (and speaking the same side twice) when voices arrive.
          useEffect(() => {
            if (!(\'speechSynthesis\' in window)) return;

            const loadVoice = () => {
              const voices = window.speechSynthesis.getVoices();
              selectedVoiceRef.current =
                voices.find((voice) => voice.lang.startsWith(\'en\') && voice.name.includes(\'Google\')) ??
                voices.find((voice) => voice.lang.startsWith(\'en\')) ??
                null;
            };

            loadVoice();
            window.speechSynthesis.addEventListener(\'voiceschanged\', loadVoice);
            return () => window.speechSynthesis.removeEventListener(\'voiceschanged\', loadVoice);
          }, []);

          // Reset scratchpad'''
          text, count = re.subn(
              r"  // Setup speech synthesis voices once on mount and handle cleanup\n  useEffect\(\(\) => \{.*?\n  \}, \[\]\);\n\n  // Reset scratchpad",
              voice_block,
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'voice setup block not found'

          speak_block = '''  // Helper function to synthesize speech. This callback stays stable so voice
          // discovery cannot retrigger an already-spoken question or answer.
          const speakText = React.useCallback((textToRead: string) => {
            const cleanText = textToRead
              .replace(/\\{\\{c\\d+::(.*?)\\}\\}/g, '$1')
              .replace(/```[\\s\\S]*?```/g, '')
              .replace(/[`*#_-]/g, ' ')
              .replace(/\\s+/g, ' ')
              .trim();

            if (!cleanText || !(\'speechSynthesis\' in window)) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';

            const fallbackVoice = window.speechSynthesis
              .getVoices()
              .find((voice) => voice.lang.startsWith('en'));
            utterance.voice = selectedVoiceRef.current ?? fallbackVoice ?? null;

            const savedSpeed = Number.parseFloat(localStorage.getItem('denki-speech-speed') ?? '1.0');
            utterance.rate = Number.isFinite(savedSpeed) ? savedSpeed : 1;
            window.speechSynthesis.speak(utterance);
          }, []);

          const autoSpeechTimerRef = useRef<number | null>(null);

          // Defer automatic speech by one task. During rating, Zustand advances to
          // the next keyed card before the page resets `isFlipped`; without this
          // settling window the new card briefly mounts on its back, speaks its
          // answer, then suppresses its question. Cleanup cancels that stale task,
          // so the settled front is what gets read.
          useEffect(() => {
            if (autoSpeechTimerRef.current !== null) {
              window.clearTimeout(autoSpeechTimerRef.current);
              autoSpeechTimerRef.current = null;
            }

            if (!autoSpeak) {
              if ('speechSynthesis' in window) window.speechSynthesis.cancel();
              return;
            }

            const textToSpeak = isFlipped ? card.back : card.front;
            autoSpeechTimerRef.current = window.setTimeout(() => {
              autoSpeechTimerRef.current = null;
              speakText(textToSpeak);
            }, 0);

            return () => {
              if (autoSpeechTimerRef.current !== null) {
                window.clearTimeout(autoSpeechTimerRef.current);
                autoSpeechTimerRef.current = null;
              }
            };
          }, [card.id, card.front, card.back, isFlipped, autoSpeak, speakText]);

          // Cleanup speech on unmount'''
          text, count = re.subn(
              r"  // Helper function to synthesize speech\n  const speakText = React\.useCallback\(.*?\n  // Cleanup speech on unmount",
              speak_block,
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'speech callback/effect block not found'

          cleanup_old = '''  useEffect(() => {
            return () => {
              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
              }
            };
          }, []);'''
          cleanup_new = '''  useEffect(() => {
            return () => {
              if (autoSpeechTimerRef.current !== null) {
                window.clearTimeout(autoSpeechTimerRef.current);
              }
              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
              }
            };
          }, []);'''
          assert cleanup_old in text, 'cleanup block not found'
          text = text.replace(cleanup_old, cleanup_new, 1)

          old_label = 'aria-label="Pronounce text"\n                  title="Pronounce English Text"'
          assert text.count(old_label) == 2, 'expected two manual speech controls'
          text = text.replace(
              old_label,
              'aria-label="Read question aloud"\n                  title="Read Question Aloud"',
              1,
          )
          text = text.replace(
              old_label,
              'aria-label="Read answer aloud"\n                title="Read Answer Aloud"',
              1,
          )
          flashcard_path.write_text(text)

          session_path = Path('src/pages/StudySessionPage.tsx')
          session = session_path.read_text()
          session = session.replace(
              'aria-label="Auto-pronounce answers"',
              'aria-label="Automatically read questions and answers"',
              1,
          ).replace(
              "title={`Auto Pronounce English (${autoSpeak ? 'ON' : 'OFF'})`}",
              "title={`Auto-read Questions and Answers (${autoSpeak ? 'ON' : 'OFF'})`}",
              1,
          )
          session_path.write_text(session)

          test_path = Path('src/components/__tests__/FlashcardSpeech.test.tsx')
          test_path.write_text(r'''import React from 'react';
          import { act, render } from '@testing-library/react';
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
          import type { Card } from '../../db/schema';
          import { Flashcard } from '../Flashcard';

          class TestUtterance {
            text: string;
            lang = '';
            voice: SpeechSynthesisVoice | null = null;
            rate = 1;

            constructor(text: string) {
              this.text = text;
            }
          }

          const card = (id: number, front: string, back: string): Card => ({
            id,
            classId: 1,
            deckId: 1,
            front,
            back,
            cardType: 'standard',
            createdAt: new Date(),
            state: 0,
            stability: 0,
            difficulty: 0,
            elapsedDays: 0,
            scheduledDays: 0,
            due: new Date(),
          });

          describe('Flashcard automatic speech', () => {
            const speak = vi.fn();
            const cancel = vi.fn();
            const voice = {
              default: true,
              lang: 'en-US',
              localService: true,
              name: 'Test English',
              voiceURI: 'test-english',
            } as SpeechSynthesisVoice;

            beforeEach(() => {
              vi.useFakeTimers();
              speak.mockReset();
              cancel.mockReset();
              vi.stubGlobal('SpeechSynthesisUtterance', TestUtterance);
              Object.defineProperty(window, 'speechSynthesis', {
                configurable: true,
                value: {
                  addEventListener: vi.fn(),
                  removeEventListener: vi.fn(),
                  getVoices: vi.fn(() => [voice]),
                  speak,
                  cancel,
                } as unknown as SpeechSynthesis,
              });
              vi.spyOn(HTMLCanvasElement.prototype, 'getContext').mockReturnValue(null);
            });

            afterEach(() => {
              act(() => vi.runOnlyPendingTimers());
              vi.useRealTimers();
              vi.unstubAllGlobals();
              vi.restoreAllMocks();
            });

            it('reads the next question instead of its answer during the flipped-to-front transition', () => {
              const first = card(1, 'Question one', 'Answer one');
              const second = card(2, 'Question two', 'Answer two');
              const onFlip = vi.fn();

              const view = render(
                <Flashcard key={first.id} card={first} isFlipped={false} onFlip={onFlip} autoSpeak />,
              );
              act(() => vi.runOnlyPendingTimers());

              view.rerender(
                <Flashcard key={first.id} card={first} isFlipped onFlip={onFlip} autoSpeak />,
              );
              act(() => vi.runOnlyPendingTimers());

              // Reproduce the rating race: the next keyed card briefly receives
              // the old flipped state before StudySessionPage resets the side.
              view.rerender(
                <Flashcard key={second.id} card={second} isFlipped onFlip={onFlip} autoSpeak />,
              );
              view.rerender(
                <Flashcard key={second.id} card={second} isFlipped={false} onFlip={onFlip} autoSpeak />,
              );
              act(() => vi.runOnlyPendingTimers());

              const spoken = speak.mock.calls.map(([utterance]) => (utterance as TestUtterance).text);
              expect(spoken).toEqual(['Question one', 'Answer one', 'Question two']);
              expect(spoken).not.toContain('Answer two');
            });

            it('cancels pending automatic speech when the feature is switched off', () => {
              const current = card(1, 'Question', 'Answer');
              const view = render(
                <Flashcard card={current} isFlipped={false} onFlip={vi.fn()} autoSpeak />,
              );

              view.rerender(
                <Flashcard card={current} isFlipped={false} onFlip={vi.fn()} autoSpeak={false} />,
              );
              act(() => vi.runOnlyPendingTimers());

              expect(speak).not.toHaveBeenCalled();
              expect(cancel).toHaveBeenCalled();
            });
          });
          '''.replace('\n          ', '\n').lstrip())
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Flashcard.tsx src/pages/StudySessionPage.tsx src/components/__tests__/FlashcardSpeech.test.tsx
          git commit -m "fix(study): auto-read each new question"
          git push origin HEAD:fix/auto-read-question
