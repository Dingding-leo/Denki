              db.cards.where('deckId').equals(deckId).count(),
              deckDueCount(deckId, now),
              db.cards.where('[deckId+state]').equals([deckId, 2]).count(),
            ]);

            return {
              total,
              dueCount,
              masteryPct: total > 0 ? Math.round((masteredCount / total) * 100) : 0,
            };
          }

