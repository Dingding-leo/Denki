name: Apply unlimited study and drill mode

on:
  push:
    branches: [feat/unlimited-study-drill-mode]
    paths:
      - .github/workflows/apply-unlimited-drill.yml
      - scripts/apply-unlimited-drill.py
      - scripts/fix-apply-script.py

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unlimited-study-drill-mode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair implementation script
        run: python3 scripts/fix-apply-script.py
      - name: Apply implementation
        run: python3 scripts/apply-unlimited-drill.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/apply-unlimited-drill.yml scripts/apply-unlimited-drill.py scripts/fix-apply-script.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(study): remove daily cap and add deck drill mode"
          git push origin HEAD:feat/unlimited-study-drill-mode
