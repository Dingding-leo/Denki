name: Apply unlimited study and drill mode

on:
  push:
    branches: [feat/unlimited-study-drill-mode]
    paths:
      - .github/workflows/apply-unlimited-drill.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unlimited-study-drill-mode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Implement unlimited study and deck drill mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise AssertionError(f"Expected text not found in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise AssertionError(f"Expected one regex match in {path}, got {count}: {pattern[:100]!r}")
              write(path, updated)

          # ---------- Drill-domain helpers ----------
          write('src/services/drill.ts', '''import type { Card } from '../db/schema';
          import { normalizeStoredRating, type Rating } from './reviewRatings';

          export type DrillBucket = 'new' | Rating;

          export const ALL_DRILL_BUCKETS: readonly DrillBucket[] = ['new', 1, 2, 3, 4];

          export type DrillBucketCounts = Record<DrillBucket, number>;

          export function getDrillBucket(
            card: Pick<Card, 'lastRating'>,
          ): DrillBucket {
            return normalizeStoredRating(card.lastRating) ?? 'new';
          }

          export function filterDrillCards(
            cards: readonly Card[],
            buckets: readonly DrillBucket[],
          ): Card[] {
            const selected = new Set<DrillBucket>(buckets);
            return cards.filter((card) => selected.has(getDrillBucket(card)));
          }

          export function countDrillBuckets(cards: readonly Card[]): DrillBucketCounts {
            const counts: DrillBucketCounts = { new: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
            for (const card of cards) counts[getDrillBucket(card)] += 1;
            return counts;
          }
          '''.replace('\n          ', '\n').lstrip())

          write('src/components/modals/DrillSetupModal.tsx', '''import React, { useEffect, useMemo, useRef, useState } from 'react';
          import { Check, Shuffle, X } from 'lucide-react';
          import { db } from '../../db';
          import type { Card } from '../../db/schema';
          import {
            ALL_DRILL_BUCKETS,
            countDrillBuckets,
            filterDrillCards,
            type DrillBucket,
          } from '../../services/drill';
          import { REVIEW_RATINGS } from '../../services/reviewRatings';

          interface DrillSetupModalProps {
            deckId: number;
            deckName: string;
            onClose: () => void;
            onStart: (buckets: readonly DrillBucket[]) => Promise<void>;
          }

          const bucketDefinitions: readonly {
            bucket: DrillBucket;
            label: string;
            description: string;
            color: string;
          }[] = [
            {
              bucket: 'new',
              label: 'New / unrated',
              description: 'Cards without a previous confidence result',
              color: '#8c9584',
            },
            ...REVIEW_RATINGS.map((rating) => ({
              bucket: rating.rating as DrillBucket,
              label: `${rating.rating} · ${rating.label}`,
              description: rating.description,
              color: rating.color,
            })),
          ];

          export const DrillSetupModal: React.FC<DrillSetupModalProps> = ({
            deckId,
            deckName,
            onClose,
            onStart,
          }) => {
            const [cards, setCards] = useState<Card[]>([]);
            const [selected, setSelected] = useState<DrillBucket[]>(() => [...ALL_DRILL_BUCKETS]);
            const [loading, setLoading] = useState(true);
            const [starting, setStarting] = useState(false);
            const [error, setError] = useState('');
            const dialogRef = useRef<HTMLDivElement>(null);
            const closeButtonRef = useRef<HTMLButtonElement>(null);

            useEffect(() => {
              let cancelled = false;
              setLoading(true);
              setError('');
              void db.cards.where('deckId').equals(deckId).toArray()
                .then((rows) => {
                  if (!cancelled) setCards(rows);
                })
                .catch((caughtError: unknown) => {
                  if (!cancelled) {
                    setError(caughtError instanceof Error ? caughtError.message : 'The deck could not be read.');
                  }
                })
                .finally(() => {
                  if (!cancelled) setLoading(false);
                });
              return () => {
                cancelled = true;
              };
            }, [deckId]);

            useEffect(() => {
              const previousFocus = document.activeElement as HTMLElement | null;
              closeButtonRef.current?.focus();

              const handleKeyDown = (event: KeyboardEvent) => {
                if (event.key === 'Escape') {
                  event.preventDefault();
                  onClose();
                  return;
                }
                if (event.key !== 'Tab') return;

                const focusable = dialogRef.current?.querySelectorAll<HTMLElement>(
                  'button:not(:disabled), [href], input:not(:disabled), [tabindex]:not([tabindex="-1"])',
                );
                if (!focusable || focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                  event.preventDefault();
                  last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                  event.preventDefault();
                  first.focus();
                }
              };

              window.addEventListener('keydown', handleKeyDown, true);
              return () => {
                window.removeEventListener('keydown', handleKeyDown, true);
                previousFocus?.focus();
              };
            }, [onClose]);

            const counts = useMemo(() => countDrillBuckets(cards), [cards]);
            const selectedCount = useMemo(
              () => filterDrillCards(cards, selected).length,
              [cards, selected],
            );

            const toggleBucket = (bucket: DrillBucket) => {
              setSelected((current) => current.includes(bucket)
                ? current.filter((item) => item !== bucket)
                : [...current, bucket]);
            };

            const handleStart = async () => {
              if (starting || loading || selectedCount === 0) return;
              setStarting(true);
              setError('');
              try {
                await onStart(selected);
              } catch (caughtError) {
                setError(caughtError instanceof Error ? caughtError.message : 'The drill could not start.');
                setStarting(false);
              }
            };

            return (
              <div
                onMouseDown={(event) => {
                  if (event.target === event.currentTarget && !starting) onClose();
                }}
                style={{
                  position: 'fixed',
                  inset: 0,
                  zIndex: 2400,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  padding: '20px',
                  background: 'rgba(4, 10, 7, 0.8)',
                  backdropFilter: 'blur(8px)',
                }}
              >
                <div
                  ref={dialogRef}
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="drill-setup-title"
                  className="glass-panel"
                  style={{
                    width: 'min(620px, 100%)',
                    maxHeight: 'calc(100vh - 40px)',
                    overflowY: 'auto',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: '18px',
                    borderTop: '6px solid var(--accent-color)',
                  }}
                >
                  <header style={{ display: 'flex', justifyContent: 'space-between', gap: '16px', borderBottom: '2px solid var(--border)', paddingBottom: '14px' }}>
                    <div>
                      <p className="zine-section-kicker">Prepare to drill / one pass</p>
                      <h2 id="drill-setup-title" style={{ marginTop: '5px', fontSize: '24px' }}>{deckName}</h2>
                      <p style={{ marginTop: '7px', color: 'var(--text-secondary)', fontSize: '13px', lineHeight: 1.5 }}>
                        Randomize the selected cards, see each exactly once, and keep every rating for future spaced-review scheduling.
                      </p>
                    </div>
                    <button
                      ref={closeButtonRef}
                      type="button"
                      onClick={onClose}
                      disabled={starting}
                      className="btn-premium-secondary"
                      aria-label="Close drill setup"
                      style={{ width: '34px', height: '34px', padding: 0, flexShrink: 0 }}
                    >
                      <X size={16} />
                    </button>
                  </header>

                  <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) auto', gap: '16px', alignItems: 'end' }}>
                    <div>
                      <span className="zine-field-label">Cards selected</span>
                      <div style={{ marginTop: '5px', fontFamily: 'var(--font-display)', fontSize: '48px', lineHeight: 0.9, color: 'var(--text-primary)' }}>
                        {loading ? '—' : selectedCount}
                      </div>
                      <p style={{ marginTop: '7px', color: 'var(--text-muted)', fontSize: '11px', fontFamily: 'var(--font-mono)', textTransform: 'uppercase' }}>
                        of {cards.length} cards · no repeats · no usage limit
                      </p>
                    </div>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                      <button type="button" className="btn-premium-secondary" onClick={() => setSelected([...ALL_DRILL_BUCKETS])}>
                        Select all
                      </button>
                      <button type="button" className="btn-premium-secondary" onClick={() => setSelected([1, 2])}>
                        Again + Hard
                      </button>
                    </div>
                  </div>

                  <section>
                    <div className="zine-section-heading" style={{ marginBottom: '10px' }}>
                      <span className="zine-section-number">01</span>
                      <h3>Previous level filter</h3>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '9px' }}>
                      {bucketDefinitions.map((definition) => {
                        const active = selected.includes(definition.bucket);
                        return (
                          <button
                            key={definition.bucket}
                            type="button"
                            aria-pressed={active}
                            onClick={() => toggleBucket(definition.bucket)}
                            style={{
                              minHeight: '76px',
                              display: 'grid',
                              gridTemplateColumns: '26px minmax(0, 1fr) auto',
                              gap: '9px',
                              alignItems: 'start',
                              padding: '11px',
                              textAlign: 'left',
                              color: active ? 'var(--text-primary)' : 'var(--text-muted)',
                              background: active ? 'rgba(127, 156, 134, 0.12)' : 'rgba(255,255,255,0.015)',
                              border: `1px solid ${active ? definition.color : 'var(--border)'}`,
                              cursor: 'pointer',
                            }}
                          >
                            <span style={{ width: '22px', height: '22px', display: 'grid', placeItems: 'center', border: `1px solid ${active ? definition.color : 'var(--border)'}`, background: active ? definition.color : 'transparent', color: '#0d1511' }}>
                              {active && <Check size={13} />}
                            </span>
                            <span>
                              <strong style={{ display: 'block', fontSize: '12px' }}>{definition.label}</strong>
                              <small style={{ display: 'block', marginTop: '4px', color: 'var(--text-muted)', fontSize: '10px', lineHeight: 1.35 }}>{definition.description}</small>
                            </span>
                            <strong style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: definition.color }}>
                              {counts[definition.bucket]}
                            </strong>
                          </button>
                        );
                      })}
                    </div>
                  </section>

                  {error && (
                    <div role="alert" style={{ padding: '10px 12px', border: '1px solid #a87869', color: '#d6a193', fontSize: '12px' }}>
                      {error}
                    </div>
                  )}

                  <footer style={{ display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'center', borderTop: '2px solid var(--border)', paddingTop: '14px' }}>
                    <p style={{ color: 'var(--text-muted)', fontSize: '10px', fontFamily: 'var(--font-mono)', textTransform: 'uppercase', lineHeight: 1.45 }}>
                      Low ratings will not repeat during this drill.<br />They will affect later Study sessions.
                    </p>
                    <div style={{ display: 'flex', gap: '9px' }}>
                      <button type="button" className="btn-premium-secondary" onClick={onClose} disabled={starting}>Cancel</button>
                      <button
                        type="button"
                        className="btn-premium-primary"
                        onClick={() => void handleStart()}
                        disabled={loading || starting || selectedCount === 0}
                      >
                        <Shuffle size={15} /> {starting ? 'Building drill…' : `Drill ${selectedCount} cards`}
                      </button>
                    </div>
                  </footer>
                </div>
              </div>
            );
          };
          '''.replace('\n          ', '\n').lstrip())

          # ---------- Remove daily new-card caps and add drill sessions ----------
          study_path = 'src/store/slices/studySlice.ts'
          study = read(study_path)
          study = study.replace(
              "import { loadNewCardsPerDay, countNewIntroducedToday, newCardAllowance } from '../../services/studyLimits';\n",
              "import { ALL_DRILL_BUCKETS, filterDrillCards } from '../../services/drill';\n",
              1,
          )
          study, count = re.subn(
              r"const isNewCard = .*?\n\n// Guards rateCard/undoLastRate",
              "// Guards rateCard/undoLastRate",
              study,
              count=1,
              flags=re.S,
          )
          assert count == 1
          study, count = re.subn(
              r"    // Spaced repetition due card filter \(due <= now\)\n    let filteredCards = deckCards;.*?\n    // Every session receives",
              """    // Normal study includes every new card plus scheduled reviews due now.
    // There is intentionally no daily introduction cap.
    let filteredCards = deckCards;
    const isCram = forceCram || (deckCards.length > 0 && deckCards.every((card) => card.due === undefined));

    if (!forceCram) {
      filteredCards = deckCards.filter((card) => {
        if (!card.lastReviewed || card.state === 0) return true;
        return new Date(card.due).getTime() <= now.getTime();
      });
    }

    // Every session receives""",
              study,
              count=1,
              flags=re.S,
          )
          assert count == 1
          study, count = re.subn(
              r"    let filteredCards = classCards;\n    const isCram = forceCram;.*?\n    // Every session receives",
              """    let filteredCards = classCards;
    const isCram = forceCram;

    if (!forceCram) {
      filteredCards = classCards.filter((card) => {
        if (!card.lastReviewed || card.state === 0) return true;
        return new Date(card.due).getTime() <= now.getTime();
      });
    }

    // Every session receives""",
              study,
              count=1,
              flags=re.S,
          )
          assert count == 1
          study, count = re.subn(
              r"    let filteredCards = allCards;\n    let heldBack = 0;.*?\n    // A fresh daily queue",
              """    let filteredCards = allCards;
    if (!forceCram) {
      filteredCards = allCards.filter((card) => {
        if (!card.lastReviewed || card.state === 0) return true;
        return new Date(card.due).getTime() <= now.getTime();
      });
    }

    // A fresh daily queue""",
              study,
              count=1,
              flags=re.S,
          )
          assert count == 1
          study = study.replace('    notifyHeldBack(heldBack);\n', '')
          drill_action = '''  startDrillSession: async (deckId, buckets = ALL_DRILL_BUCKETS) => {
            const deckCards = await db.cards.where('deckId').equals(deckId).toArray();
            const selectedCards = filterDrillCards(deckCards, buckets);
            const queue = buildStudyQueue(selectedCards);

            set({
              session: {
                deckId,
                isDrill: true,
                drillBuckets: [...buckets],
                queue,
                currentIndex: 0,
                completedCount: 0,
                initialQueueSize: queue.length,
                totalCards: deckCards.length,
                isCram: false,
                history: [],
              },
            });
          },

          '''.replace('\n          ', '\n')
          marker = '  rateCard: async (rating) => {'
          assert marker in study
          study = study.replace(marker, drill_action + marker, 1)
          study = study.replace('      if (rating <= 2) {', '      if (!sessionRef.isDrill && rating <= 2) {', 1)
          write(study_path, study)

          # ---------- Session/store types ----------
          types_path = 'src/store/types.ts'
          types = read(types_path)
          types = types.replace(
              "import type { Rating } from '../services/scheduler';\n",
              "import type { DrillBucket } from '../services/drill';\nimport type { Rating } from '../services/scheduler';\n",
              1,
          )
          types = types.replace(
              "  isCram?: boolean;       // If studying all cards instead of strictly due ones\n",
              "  isCram?: boolean;       // If studying all cards instead of strictly due ones\n  isDrill?: boolean;      // Random one-pass deck session; low ratings never reinsert\n  drillBuckets?: DrillBucket[]; // Previous-level buckets included in this drill\n",
              1,
          )
          types = types.replace(
              "  startGlobalStudySession: (forceCram?: boolean) => Promise<void>;\n",
              "  startGlobalStudySession: (forceCram?: boolean) => Promise<void>;\n  startDrillSession: (deckId: number, buckets?: readonly DrillBucket[]) => Promise<void>;\n",
              1,
          )
          write(types_path, types)

          # ---------- Persist and resume Drill separately from normal Study ----------
          write('src/services/studySessionPersistence.ts', '''import { db } from '../db';
          import { ALL_DRILL_BUCKETS, type DrillBucket } from './drill';
          import type { StudySession } from '../store/types';

          const STORAGE_KEY = 'denki.study-session.v1';
          const SNAPSHOT_VERSION = 1;
          const MAX_SESSION_AGE_MS = 24 * 60 * 60 * 1000;
          const VALID_DRILL_BUCKETS = new Set<DrillBucket>(ALL_DRILL_BUCKETS);

          interface PersistedStudySession {
            version: typeof SNAPSHOT_VERSION;
            savedAt: number;
            deckId?: number;
            classId?: number;
            isGlobal?: boolean;
            queueCardIds: number[];
            currentIndex: number;
            completedCount: number;
            initialQueueSize: number;
            totalCards: number;
            isCram?: boolean;
            isDrill?: boolean;
            drillBuckets?: DrillBucket[];
          }

          export interface StudySessionScope {
            deckId?: number;
            classId?: number;
            isGlobal?: boolean;
            isDrill?: boolean;
          }

          function getStorage(): Storage | null {
            if (typeof window === 'undefined') return null;
            try {
              return window.localStorage;
            } catch {
              return null;
            }
          }

          function isFiniteNonNegativeInteger(value: unknown): value is number {
            return Number.isInteger(value) && Number(value) >= 0;
          }

          function isValidDrillBucket(value: unknown): value is DrillBucket {
            return VALID_DRILL_BUCKETS.has(value as DrillBucket);
          }

          function isValidSnapshot(value: unknown): value is PersistedStudySession {
            if (!value || typeof value !== 'object') return false;
            const snapshot = value as Partial<PersistedStudySession>;

            return (
              snapshot.version === SNAPSHOT_VERSION &&
              typeof snapshot.savedAt === 'number' &&
              Number.isFinite(snapshot.savedAt) &&
              Array.isArray(snapshot.queueCardIds) &&
              snapshot.queueCardIds.every((id) => Number.isInteger(id) && id > 0) &&
              isFiniteNonNegativeInteger(snapshot.currentIndex) &&
              isFiniteNonNegativeInteger(snapshot.completedCount) &&
              isFiniteNonNegativeInteger(snapshot.initialQueueSize) &&
              isFiniteNonNegativeInteger(snapshot.totalCards) &&
              (snapshot.deckId === undefined || (Number.isInteger(snapshot.deckId) && snapshot.deckId > 0)) &&
              (snapshot.classId === undefined || (Number.isInteger(snapshot.classId) && snapshot.classId > 0)) &&
              (snapshot.isGlobal === undefined || typeof snapshot.isGlobal === 'boolean') &&
              (snapshot.isCram === undefined || typeof snapshot.isCram === 'boolean') &&
              (snapshot.isDrill === undefined || typeof snapshot.isDrill === 'boolean') &&
              (snapshot.drillBuckets === undefined || (
                Array.isArray(snapshot.drillBuckets) &&
                snapshot.drillBuckets.every(isValidDrillBucket)
              )) &&
              (!snapshot.isDrill || snapshot.deckId !== undefined) &&
              (snapshot.deckId !== undefined || snapshot.classId !== undefined || snapshot.isGlobal === true)
            );
          }

          function scopeMatches(snapshot: PersistedStudySession, scope: StudySessionScope): boolean {
            if (scope.isDrill !== undefined && Boolean(snapshot.isDrill) !== scope.isDrill) return false;
            if (scope.isGlobal) return snapshot.isGlobal === true;
            if (scope.deckId !== undefined) return snapshot.deckId === scope.deckId;
            if (scope.classId !== undefined) return snapshot.classId === scope.classId;
            return false;
          }

          export function persistStudySession(session: StudySession): void {
            const storage = getStorage();
            if (!storage) return;

            const queueCardIds = session.queue.map((card) => card.id);
            if (
              queueCardIds.length === 0 ||
              queueCardIds.some((id): id is undefined => id === undefined)
            ) {
              clearPersistedStudySession();
              return;
            }

            const snapshot: PersistedStudySession = {
              version: SNAPSHOT_VERSION,
              savedAt: Date.now(),
              deckId: session.deckId,
              classId: session.classId,
              isGlobal: session.isGlobal,
              queueCardIds: queueCardIds as number[],
              currentIndex: session.currentIndex,
              completedCount: session.completedCount,
              initialQueueSize: session.initialQueueSize,
              totalCards: session.totalCards,
              isCram: session.isCram,
              isDrill: session.isDrill,
              drillBuckets: session.drillBuckets,
            };

            try {
              storage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
            } catch (error) {
              console.warn('Unable to persist study session:', error);
            }
          }

          export function clearPersistedStudySession(): void {
            const storage = getStorage();
            if (!storage) return;

            try {
              storage.removeItem(STORAGE_KEY);
            } catch (error) {
              console.warn('Unable to clear persisted study session:', error);
            }
          }

          export async function restorePersistedStudySession(
            scope: StudySessionScope,
          ): Promise<StudySession | null> {
            const storage = getStorage();
            if (!storage) return null;

            let snapshot: PersistedStudySession;
            try {
              const raw = storage.getItem(STORAGE_KEY);
              if (!raw) return null;

              const parsed: unknown = JSON.parse(raw);
              if (!isValidSnapshot(parsed)) {
                clearPersistedStudySession();
                return null;
              }
              snapshot = parsed;
            } catch (error) {
              console.warn('Unable to read persisted study session:', error);
              clearPersistedStudySession();
              return null;
            }

            if (!scopeMatches(snapshot, scope)) return null;

            if (Date.now() - snapshot.savedAt > MAX_SESSION_AGE_MS) {
              clearPersistedStudySession();
              return null;
            }

            if (snapshot.currentIndex > snapshot.queueCardIds.length) {
              clearPersistedStudySession();
              return null;
            }

            try {
              const cards = await db.cards.bulkGet(snapshot.queueCardIds);
              if (cards.some((card) => card === undefined)) {
                clearPersistedStudySession();
                return null;
              }

              const queue = cards.map((card) => card!);
              const queueMatchesScope = scope.isGlobal
                ? true
                : scope.deckId !== undefined
                  ? queue.every((card) => card.deckId === scope.deckId)
                  : queue.every((card) => card.classId === scope.classId);

              if (!queueMatchesScope) {
                clearPersistedStudySession();
                return null;
              }

              return {
                deckId: snapshot.deckId,
                classId: snapshot.classId,
                isGlobal: snapshot.isGlobal,
                queue,
                currentIndex: snapshot.currentIndex,
                completedCount: Math.min(snapshot.completedCount, queue.length),
                initialQueueSize: snapshot.initialQueueSize,
                totalCards: snapshot.totalCards,
                isCram: snapshot.isCram,
                isDrill: snapshot.isDrill,
                drillBuckets: snapshot.isDrill
                  ? snapshot.drillBuckets ?? [...ALL_DRILL_BUCKETS]
                  : undefined,
                // Undo history remains in-memory only to keep snapshots compact.
                history: [],
              };
            } catch (error) {
              console.warn('Unable to restore persisted study session:', error);
              return null;
            }
          }
          '''.replace('\n          ', '\n').lstrip())

          write('src/store/useFlashcardStore.ts', '''import { create } from 'zustand';
          import {
            clearPersistedStudySession,
            persistStudySession,
            restorePersistedStudySession,
          } from '../services/studySessionPersistence';
          import { createClassSlice } from './slices/classSlice';
          import { createDeckSlice } from './slices/deckSlice';
          import { createCardSlice } from './slices/cardSlice';
          import { createStudySlice } from './slices/studySlice';
          import { createStatsSlice } from './slices/statsSlice';
          import type { FlashcardState } from './types';
          import { toast } from './uiStore';

