name: Apply randomized review upgrade

on:
  push:
    branches: [feat/randomized-four-level-review]
    paths:
      - .github/workflows/apply-review-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/randomized-four-level-review
      - name: Apply reviewed implementation patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/apply-review-upgrade.py
          python /tmp/apply-review-upgrade.py
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No implementation changes generated"
            exit 0
          fi
          git commit -m "feat(study): randomize review flow and use four ratings"
          git push origin HEAD:feat/randomized-four-level-review
