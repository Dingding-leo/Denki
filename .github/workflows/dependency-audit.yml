name: Temporary dependency audit

on:
  push:
    branches: [refactor/existing-function-hardening]
    paths:
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/existing-function-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - name: Complete dependency audit
        run: npm audit || true
