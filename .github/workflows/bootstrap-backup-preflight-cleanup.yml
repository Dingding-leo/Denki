name: Bootstrap backup preflight review fixes

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/bootstrap-backup-preflight-cleanup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/backup-import-preflight
      - name: Apply review fixes and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          def indent_between(path: str, start_marker: str, end_marker: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              lines = block.splitlines()
              formatted = [lines[0]] + [
                  f'  {line}' if line else line
                  for line in lines[1:]
              ]
              file.write_text(text[:start] + '\n'.join(formatted) + text[end:])

          settings = 'src/components/modals/SettingsModal.tsx'
          replace_once(
              settings,
              '        if (!optimizingMedia) onClose();',
              '        if (!optimizingMedia && !importing) onClose();',
          )
          replace_once(
              settings,
              '  }, [onClose, optimizingMedia]);',
              '  }, [onClose, optimizingMedia, importing]);',
          )

          indent_between(
              'src/services/__tests__/backup.test.ts',
              "  it('prepares a validated one-shot import summary before replacing data'",
              "  it('restores target retention and speech speed while clearing retired overrides'",
          )
          indent_between(
              'src/services/__tests__/maintenanceOperations.test.ts',
              "  it('holds the lease while applying a prevalidated import plan'",
              "  it('does not enter the restore callback when another maintenance operation owns the lease'",
          )

          test_path = Path('src/components/__tests__/SettingsBackupImport.test.tsx')
          test_text = test_path.read_text()
          marker = "  it('does not open a destructive confirmation for an invalid backup', async () => {"
          addition = """  it('cannot close Settings with Escape while inspection is still running', async () => {
            let finishInspection: ((value: typeof prepared) => void) | undefined;
            mocks.prepare.mockImplementation(
              () => new Promise((resolve) => {
                finishInspection = resolve;
              }),
            );
            const onClose = vi.fn();
            render(<SettingsModal onClose={onClose} />);
            chooseFile(backupFile());

            await waitFor(() =>
              expect(
                screen.getByRole('button', { name: 'Inspecting…' }),
              ).toBeDisabled(),
            );
            fireEvent.keyDown(window, { key: 'Escape' });
            expect(onClose).not.toHaveBeenCalled();

            await act(async () => {
              finishInspection?.(prepared);
            });
            await waitFor(() => expect(mocks.confirm).toHaveBeenCalledTimes(1));
          });

          """
          if marker not in test_text:
              raise SystemExit('Settings backup test insertion marker was not found.')
          test_path.write_text(test_text.replace(marker, addition + marker, 1))
          PY
      - name: Remove one-time review workflow
        run: rm .github/workflows/bootstrap-backup-preflight-cleanup.yml
      - name: Validate review fixes
        run: |
          git diff --check
          npm ci
          npx tsc --noEmit
          npm run lint
          npx vitest run \
            src/services/__tests__/backup.test.ts \
            src/services/__tests__/maintenanceOperations.test.ts \
            src/components/__tests__/SettingsBackupImport.test.tsx \
            src/components/__tests__/ConfirmDialogHost.test.tsx
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/bootstrap-backup-preflight-cleanup.yml
          git commit -m "fix: keep backup inspection modal-owned"
          git push origin HEAD:feat/backup-import-preflight
