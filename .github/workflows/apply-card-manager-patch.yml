name: Apply card-manager reliability patch

on:
  push:
    branches: [refactor/library-loading-card-manager]
    paths:
      - .github/workflows/apply-card-manager-patch.yml
      - scripts/patch-card-manager.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/library-loading-card-manager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/patch-card-manager.py
      - run: npm ci
      - run: npx prettier@3.6.2 --write src/components/modals/ManageCardsModal.tsx src/db/index.ts src/store/slices/classSlice.ts src/store/slices/deckSlice.ts src/store/slices/cardSlice.ts src/db/__tests__/migrations.test.ts src/store/slices/__tests__/loadRaces.test.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Commit verified patch
        run: |
          rm .github/workflows/apply-card-manager-patch.yml scripts/patch-card-manager.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(cards): harden loading and card-manager mutations"
          git push origin HEAD:refactor/library-loading-card-manager
